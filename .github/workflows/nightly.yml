name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-tests:
    name: Every test script (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Stock Velorn v0.3.36, which the rough-cut test opens a built project in
      # (tests/studio/rough-cut-opens.test.mjs); the checkout is shallow.
      - run: git fetch --no-tags --depth=1 origin fdd8255fb717db024688a2582022aa048dd16e84
      - run: npm test
