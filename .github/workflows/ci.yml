name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:media-preparation
      - run: npm run check:media-preparation
      - run: npm run test:export-scheduler
      - run: npm run test:rife-hardening
      # Stock Velorn v0.3.36, which the rough-cut test opens a built project in
      # (tests/studio/rough-cut-opens.test.mjs); the checkout is shallow.
      - run: git fetch --no-tags --depth=1 origin fdd8255fb717db024688a2582022aa048dd16e84
      - run: npm run test:studio
      - run: npm run build
