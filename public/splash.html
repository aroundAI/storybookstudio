<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
  <title>StorybookStudio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0B0F1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .splash-image {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .splash-status {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      padding: 10px 16px;
      font-size: 12px;
      color: #A5B4FC;
      text-align: center;
      background: #0B0F1A;
      border-top: 1px solid #1F2A44;
    }
    /* Loading state: a slow Blue → Violet sweep along the status bar's top edge. */
    .splash-status::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      width: 30%;
      height: 1px;
      background: linear-gradient(90deg, rgba(59, 130, 246, 0), #3B82F6, #8B5CF6, rgba(139, 92, 246, 0));
      animation: splash-sweep 1.8s ease-in-out infinite;
    }
    @keyframes splash-sweep {
      from { transform: translateX(-100%); }
      to { transform: translateX(340%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-status::before { animation: none; left: 35%; }
    }
  </style>
</head>
<body>
  <img
    class="splash-image"
    src="splash.png"
    alt=""
    onerror="this.onerror=null; this.src='splash.jpg'"
  />
  <div id="splash-status" class="splash-status">Starting StorybookStudio…</div>
</body>
</html>
